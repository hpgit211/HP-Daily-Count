<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Count">
<meta name="theme-color" content="#6d4aa8">
<title>Daily Count</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<style>
:root{--p:#6f4aa8;--bg:#f7f5fb;--card:#fff;--line:#ded7ea;--text:#2c2435;--muted:#766d80;--green:#1f9d55;--greenbg:#e7f7ed;--red:#d83b3b;--redbg:#fdeaea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.app{height:100%;max-width:820px;margin:auto;display:flex;flex-direction:column}
header{height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0;font-weight:800;color:var(--p)}
button{border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.iconbtn{width:42px;height:38px;background:#fff;border:1px solid var(--line);color:var(--p);font-size:19px}
.datebar{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.datebar input{height:35px;flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 9px;font-size:14px;color:var(--text)}
.datebar .small{height:35px;padding:0 14px;background:var(--p);color:white}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px;min-width:0}
.card h2{font-size:13px;margin:0 0 7px;color:var(--p);letter-spacing:.2px}
.row{display:grid;grid-template-columns:1fr 92px;align-items:center;gap:6px;margin:5px 0}
label{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input.num{width:100%;height:32px;border:1px solid #cfc5df;border-radius:8px;padding:0 7px;text-align:right;font-size:14px;background:#fff;color:var(--text)}
input.num:focus,input[type=date]:focus{outline:2px solid #cbb9e4;border-color:var(--p)}
.calc{display:grid;grid-template-columns:1fr auto 1fr;gap:5px;align-items:center;margin:6px 0}
.calc input{width:100%;height:30px}
.op{font-size:13px;font-weight:900;color:var(--p)}
.total{margin-top:7px;padding-top:6px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:900}
.total .value{font-size:16px}
.checks{margin-top:8px;background:#faf8fd;border:1px solid var(--line);border-radius:11px;padding:7px}
.checkhead{display:grid;grid-template-columns:1fr 80px 30px;gap:5px;font-size:10px;color:var(--muted);font-weight:800;margin-bottom:3px}
.checkrow{display:grid;grid-template-columns:1fr 80px 30px;gap:5px;margin:4px 0}
.checkrow input{height:29px;border:1px solid #cfc5df;border-radius:7px;padding:0 6px;font-size:12px;min-width:0;background:#fff;color:var(--text)}
.del{background:#fff0f0;color:var(--red);font-size:15px}
.add{height:30px;width:100%;margin-top:4px;background:#eee8f7;color:var(--p);font-size:12px}
.bottom{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.big{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}
.bigline{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:17px}
.bigline span:last-child{font-size:22px}
.under{margin-top:7px;padding:8px;border-radius:10px;text-align:center;font-weight:900;font-size:14px}
.green{background:var(--greenbg);color:var(--green);border:1px solid #a9e0bd}
.red{background:var(--redbg);color:var(--red);border:1px solid #efb0b0}
.actions{display:grid;grid-template-columns:1.1fr .9fr 1fr;gap:7px;margin-top:7px}
.actions button{height:36px;background:var(--p);color:#fff;font-size:12px}
.actions button.secondary{background:#fff;color:var(--p);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#28212e;color:#fff;padding:9px 14px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50;white-space:nowrap}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(25,18,32,.42);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal.show{display:flex}
.sheet{width:min(100%,520px);max-height:78vh;background:#fff;border-radius:20px 20px 0 0;padding:16px;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.sheettop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sheettop h3{margin:0;color:var(--p);font-size:18px}.close{background:#f2edf8;color:var(--p);width:36px;height:36px}
.saved-list{max-height:58vh;overflow:auto}.saved-item{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;margin:7px 0;background:#faf8fd}.saved-item button{background:var(--p);color:#fff;padding:8px 12px;font-size:12px}.empty{padding:22px 8px;text-align:center;color:var(--muted)}
.report-page{min-height:100vh;background:#f7f5fb;padding:18px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2c2435}.report-wrap{max-width:760px;margin:auto}.report-head{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:14px}.report-head h1{font-size:22px}.report-actions{display:flex;gap:7px;flex-wrap:wrap}.report-actions button{padding:10px 14px;background:#6f4aa8;color:#fff}.report-actions .secondary{background:#fff;color:#6f4aa8;border:1px solid #ded7ea}.report-card{background:#fff;border:1px solid #ded7ea;border-radius:14px;padding:14px;margin:10px 0}.report-card h2{color:#6f4aa8;font-size:16px;margin:0 0 8px}.report-table{width:100%;border-collapse:collapse}.report-table td,.report-table th{padding:8px;border-bottom:1px solid #eee;text-align:left}.report-table td:last-child,.report-table th:last-child{text-align:right}.report-total{font-weight:900}.report-under{font-size:20px;font-weight:900;text-align:center;padding:14px;border-radius:12px}
@media(max-width:430px){
 .app{max-width:410px} header{height:42px} h1{font-size:18px}.main{gap:6px}.card{padding:7px;border-radius:12px}.row{grid-template-columns:1fr 78px;gap:4px;margin:4px 0}label{font-size:10.5px}input.num{height:29px;font-size:12.5px}.card h2{font-size:11px;margin-bottom:5px}.calc{gap:3px;margin:4px 0}.total{font-size:12px}.total .value{font-size:14px}.checks{padding:5px;margin-top:6px}.checkhead,.checkrow{grid-template-columns:1fr 68px 27px}.checkrow input{font-size:10px;height:27px}.add{height:27px}.bottom{gap:6px;margin-top:6px}.big{padding:7px}.bigline{font-size:15px}.bigline span:last-child{font-size:20px}.under{font-size:13px;padding:6px}.actions{gap:5px;margin-top:6px}.actions button{height:33px;font-size:10.5px}.datebar{margin-bottom:5px}.datebar input{height:32px}.datebar .small{height:32px}
}
</style>
</head>
<body>
<div class="app">
<header><h1>Daily Count</h1><div style="display:flex;gap:5px"><button class="iconbtn" id="historyBtn" title="Saved Files">📁</button><button class="iconbtn" id="newBtn" title="New">＋</button></div></header>
<div class="datebar"><input id="date" type="date"><button class="small" id="saveBtn">Save</button></div>
<div class="main">
<section class="card">
<h2>Lottery</h2>
<div class="calc"><input class="num" id="instant" type="number" step="0.01" placeholder="0"><span class="op">＋</span><input class="num" id="online" type="number" step="0.01" placeholder="0"></div>
<div class="calc"><span class="op" style="text-align:center">Total</span><span class="op">=</span><input class="num" id="lotteryTotal" readonly></div>
<div class="calc"><input class="num" id="lotteryPayout" type="number" step="0.01" placeholder="0"><span class="op">−</span><input class="num" id="lotto" readonly></div>
<h2 style="margin-top:9px">Sales / Income</h2>
<div class="row"><label>BUS</label><input class="num" id="bus" type="number" step="0.01"></div>
<div class="row"><label>GAS</label><input class="num" id="gas" type="number" step="0.01"></div>
<div class="row"><label>TAX</label><input class="num" id="tax" type="number" step="0.01"></div>
<div class="row"><label>LOTTO</label><input class="num" id="leftLotto" readonly></div>
<div class="total"><span>LEFT TOTAL</span><span class="value" id="leftTotal">0.00</span></div>
</section>
<section class="card">
<h2>Cash / Credit</h2>
<div class="row"><label>Cash</label><input class="num" id="cash" type="number" step="0.01"></div>
<div class="row"><label>Credit</label><input class="num" id="credit" readonly></div>
<div class="calc"><input class="num" id="creditBase" type="number" step="0.01" placeholder="Credit"><span class="op">＋</span><input class="num" id="debit" type="number" step="0.01" placeholder="Debit"></div>
<div class="checks"><div class="checkhead"><span>Check payer name</span><span style="text-align:right">Amount</span><span></span></div><div id="checkRows"></div><button class="add" id="addCheck">＋ Add Check</button></div>
<div class="row"><label>Check</label><input class="num" id="checkTotal" readonly></div>
<div class="row"><label>EBT</label><input class="num" id="ebt" type="number" step="0.01"></div>
<div class="row"><label>Payout</label><input class="num" id="payout" type="number" step="0.01"></div>
<div class="row"><label>Coupon</label><input class="num" id="coupon" type="number" step="0.01"></div>
<div class="row"><label>House Charge</label><input class="num" id="house" type="number" step="0.01"></div>
<div class="total"><span>RIGHT TOTAL</span><span class="value" id="rightTotal">0.00</span></div>
</section>
</div>
<div class="bottom"><div class="big"><div class="bigline"><span>UNDER / OVER</span><span id="under">0.00</span></div><div class="under" id="underBox">Balanced</div></div></div>
<div class="actions"><button id="pdfBtn">📄 PDF Report</button><button class="secondary" id="clearBtn">Clear</button><button class="secondary" id="historyBtn2">Saved Files</button></div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="historyModal"><div class="sheet"><div class="sheettop"><h3>Saved Files</h3><button class="close" id="closeHistory">×</button></div><div class="saved-list" id="savedList"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const num=id=>parseFloat($(id).value)||0;
const money=n=>(Math.round(((Number(n)||0)+Number.EPSILON)*100)/100).toFixed(2);
const localDate=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
$('date').value=localDate();
function addCheck(name='',amount=''){
 const row=document.createElement('div');row.className='checkrow';
 const safe=String(name).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;');
 row.innerHTML='<input class="cname" placeholder="Payer name"><input class="camt" type="number" step="0.01" placeholder="0"><button class="del" type="button">×</button>';
 row.querySelector('.cname').value=name;row.querySelector('.camt').value=amount;
 row.querySelector('.del').onclick=()=>{row.remove();calc()};row.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));$('checkRows').appendChild(row);calc();
}
$('addCheck').onclick=()=>addCheck();addCheck();
function calc(){
 const lt=num('instant')+num('online');$('lotteryTotal').value=money(lt);
 const lotto=lt-num('lotteryPayout');$('lotto').value=money(lotto);$('leftLotto').value=money(lotto);
 const left=num('bus')+num('gas')+num('tax')+lotto;$('leftTotal').textContent=money(left);
 const cr=num('creditBase')+num('debit');$('credit').value=money(cr);
 let ct=0;document.querySelectorAll('.camt').forEach(x=>ct+=parseFloat(x.value)||0);$('checkTotal').value=money(ct);
 const right=num('cash')+cr+ct+num('ebt')+num('payout')+num('coupon')+num('house');$('rightTotal').textContent=money(right);
 const diff=left-right;$('under').textContent=(diff>0?'+':'')+money(diff);const box=$('underBox');box.className='under '+(diff>0?'green':diff<0?'red':'');box.textContent=diff>0?'OVER':diff<0?'UNDER':'Balanced';
}
document.querySelectorAll('input').forEach(x=>{x.addEventListener('input',calc);x.addEventListener('change',calc);x.addEventListener('keyup',calc)});
window.addEventListener('DOMContentLoaded',calc);
setTimeout(calc,50);
function data(){return{date:$('date').value,instant:$('instant').value,online:$('online').value,lotteryPayout:$('lotteryPayout').value,bus:$('bus').value,gas:$('gas').value,tax:$('tax').value,cash:$('cash').value,creditBase:$('creditBase').value,debit:$('debit').value,ebt:$('ebt').value,payout:$('payout').value,coupon:$('coupon').value,house:$('house').value,checks:[...document.querySelectorAll('.checkrow')].map(r=>({name:r.querySelector('.cname').value,amount:r.querySelector('.camt').value}))}}
function load(d){$('date').value=d.date||localDate();['instant','online','lotteryPayout','bus','gas','tax','cash','creditBase','debit','ebt','payout','coupon','house'].forEach(k=>{if($(k))$(k).value=d[k]||''});$('checkRows').innerHTML='';(d.checks||[]).forEach(c=>addCheck(c.name,c.amount));if(!(d.checks||[]).length)addCheck();calc()}
function save(){const d=data();if(!d.date){toast('Choose a date');return}const all=JSON.parse(localStorage.getItem('dailyCounts')||'{}');all[d.date]=d;localStorage.setItem('dailyCounts',JSON.stringify(all));toast('Saved for '+formatDate(d.date));renderHistory()}
function formatDate(s){if(!s)return'';const p=s.split('-');return p.length===3?new Date(Number(p[0]),Number(p[1])-1,Number(p[2])).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):s}
function openHistory(){renderHistory();$('historyModal').classList.add('show')}
function closeHistory(){$('historyModal').classList.remove('show')}
function renderHistory(){const all=JSON.parse(localStorage.getItem('dailyCounts')||'{}'),dates=Object.keys(all).sort().reverse(),list=$('savedList');if(!dates.length){list.innerHTML='<div class="empty">No saved files yet.<br>Tap Save to create a daily file.</div>';return}list.innerHTML=dates.map(d=>'<div class="saved-item"><div><strong>📄 '+formatDate(d)+'</strong></div><button type="button" data-date="'+d+'">Open</button></div>').join('');list.querySelectorAll('button').forEach(b=>b.onclick=()=>{load(all[b.dataset.date]);closeHistory();toast('Opened '+formatDate(b.dataset.date))})}
function clearForm(){if(confirm('Clear this day?')){$('instant').value='';$('online').value='';$('lotteryPayout').value='';['bus','gas','tax','cash','creditBase','debit','ebt','payout','coupon','house'].forEach(id=>$(id).value='');$('checkRows').innerHTML='';addCheck();calc()}}
function newDay(){if(confirm('Start a new day?')){$('date').value=localDate();clearFieldsWithoutConfirm()}}
function clearFieldsWithoutConfirm(){$('instant').value='';$('online').value='';$('lotteryPayout').value='';['bus','gas','tax','cash','creditBase','debit','ebt','payout','coupon','house'].forEach(id=>$(id).value='');$('checkRows').innerHTML='';addCheck();calc()}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
$('saveBtn').onclick=save;$('historyBtn').onclick=openHistory;$('historyBtn2').onclick=openHistory;$('closeHistory').onclick=closeHistory;$('historyModal').onclick=e=>{if(e.target===$('historyModal'))closeHistory()};$('clearBtn').onclick=clearForm;$('newBtn').onclick=newDay;
function reportHTML(d){calc();const diff=num('leftTotal')-num('rightTotal');const status=diff>0?'OVER':diff<0?'UNDER':'Balanced';const cls=diff>0?'over':diff<0?'under':'balanced';const checks=d.checks||[];return `<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Count Report ${d.date}</title><style>body{margin:0;background:#f7f5fb;color:#2c2435;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.head h1{color:#6f4aa8;font-size:23px;margin:0}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{border:1px solid #ded7ea;border-radius:11px;padding:10px 14px;font-weight:800;background:white;color:#6f4aa8}.actions .primary{background:#6f4aa8;color:white}.card{background:white;border:1px solid #ded7ea;border-radius:14px;padding:13px;margin-top:10px}.card h2{color:#6f4aa8;font-size:16px;margin:0 0 7px}.date{color:#766d80}.formula-text{margin-top:10px;padding:9px 11px;background:#f4effa;border:1px solid #ded7ea;border-radius:10px;color:#4b3d59;font-size:13px;line-height:1.45}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:8px;border-bottom:1px solid #eee;text-align:left}.table td:last-child,.table th:last-child{text-align:right}.total{font-weight:900}.result{margin-top:10px;padding:15px;text-align:center;border-radius:12px;font-size:20px;font-weight:900}.over{background:#e7f7ed;color:#1f9d55}.under{background:#fdeaea;color:#d83b3b}.balanced{background:#f1edf8;color:#6f4aa8}@media print{.actions{display:none}body{background:white}.card{break-inside:avoid}}</style></head><body><div class="wrap"><div class="head"><div><h1>Daily Count Report</h1><div class="date">Date: ${formatDate(d.date)}</div><div class="formula-text"><b>Lottery Formula:</b> Instant Lotto + Online Lotto = Lottery Total &nbsp; | &nbsp; Lottery Total − Lottery Payout = LOTTO</div></div><div class="actions"><button onclick="history.back()">← Back</button><button class="primary" onclick="shareReport()">↗ Share</button><button onclick="window.print()">🖨 Print / PDF</button></div></div><div class="card"><h2>Lottery</h2><table class="table"><tr><td>Instant Lotto</td><td>${money(num('instant'))}</td></tr><tr><td>Online Lotto</td><td>${money(num('online'))}</td></tr><tr class="total"><td>Lottery Total</td><td>${money(num('lotteryTotal'))}</td></tr><tr><td>Lottery Payout</td><td>${money(num('lotteryPayout'))}</td></tr><tr class="total"><td>LOTTO</td><td>${money(num('lotto'))}</td></tr></table></div><div class="card"><h2>Sales / Income</h2><table class="table">${[['BUS',num('bus')],['GAS',num('gas')],['TAX',num('tax')],['LOTTO',num('lotto')]].map(x=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td></tr>`).join('')}<tr class="total"><td>LEFT TOTAL</td><td>${money(num('leftTotal'))}</td></tr></table></div><div class="card"><h2>Cash / Credit</h2><table class="table">${[['Cash',num('cash')],['Credit',num('credit')],['Check',num('checkTotal')],['EBT',num('ebt')],['Payout',num('payout')],['Coupon',num('coupon')],['House Charge',num('house')]].map(x=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td></tr>`).join('')}<tr class="total"><td>RIGHT TOTAL</td><td>${money(num('rightTotal'))}</td></tr></table></div><div class="card"><h2>Check Details</h2><table class="table"><tr><th>Payer Name</th><th>Amount</th></tr>${checks.length?checks.map(c=>`<tr><td>${String(c.name||'')}</td><td>${money(parseFloat(c.amount)||0)}</td></tr>`).join(''):'<tr><td colspan="2">No checks</td></tr>'}</table></div><div class="result ${cls}">UNDER / OVER: ${diff>0?'+':''}${money(diff)} — ${status}</div></div><script>async function shareReport(){const text=document.title+'\nDate: ${formatDate(d.date)}\nLeft Total: ${money(num('leftTotal'))}\nRight Total: ${money(num('rightTotal'))}\nUnder / Over: ${diff>0?'+':''}${money(diff)} (${status})';if(navigator.share){try{await navigator.share({title:'Daily Count Report',text})}catch(e){}}else{try{await navigator.clipboard.writeText(text);alert('Report details copied.')}catch(e){alert(text)}}}<\/script></body></html>`}
$('pdfBtn').onclick=()=>{const d=data();save();const w=window.open();if(!w){toast('Allow pop-ups to create report');return}w.document.open();w.document.write(reportHTML(d));w.document.close()};
$('date').addEventListener('change',()=>{const all=JSON.parse(localStorage.getItem('dailyCounts')||'{}');if(all[$('date').value])load(all[$('date').value]);else calc()});
calc();renderHistory();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body></html>
